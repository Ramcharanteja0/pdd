name: Web E2E Test & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend (Vite)
        run: npm run build

      - name: Start Background Vite Preview Server
        run: |
          npx vite preview --port 5173 --host 127.0.0.1 &
          sleep 4
          curl -s http://127.0.0.1:5173 > /dev/null || (echo "Server failed to start" && exit 1)
          echo "TEST_BASE_URL=http://127.0.0.1:5173" >> $GITHUB_ENV

      - name: Install & Run Selenium E2E Test Suite (300 Test Cases)
        working-directory: ./selenium-tests
        run: |
          npm install
          npm test

      - name: Upload Selenium Excel Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-excel-report
          path: selenium-tests/Test_Results/selenium-web-report.xlsx

      - name: Generate Step Summary
        run: |
          echo "# 🧪 Web Selenium E2E Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "Successfully executed 300 Selenium Web E2E assertions." >> $GITHUB_STEP_SUMMARY

      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
