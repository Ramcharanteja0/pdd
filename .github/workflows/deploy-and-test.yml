name: Deploy and Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci

      - name: Install Selenium test dependencies
        working-directory: ./selenium-tests
        run: npm ci || npm install

      - name: Start Vite preview server
        run: |
          npm run build
          npm run preview &
        env:
          PORT: 4173

      - name: Wait for server health
        run: |
          echo "Waiting for server to be ready..."
          npx wait-on http://localhost:4173 -t 30000

      - name: Run Selenium tests
        continue-on-error: true
        working-directory: ./selenium-tests
        run: npm test

      - name: Upload Selenium test report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-excel-report
          path: selenium-tests/selenium-web-report.xlsx
          if-no-files-found: ignore
