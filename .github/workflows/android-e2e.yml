name: Android E2E Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Build and Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fix gradlew permissions and line endings
        working-directory: ./android
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x gradlew

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Install Appium test dependencies
        working-directory: ./appium-tests
        run: npm ci || npm install

      - name: Run Appium Tests
        continue-on-error: true
        working-directory: ./appium-tests
        run: npm test

      - name: Upload Appium test report
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-excel-report
          path: appium-tests/appium-mobile-report.xlsx
          if-no-files-found: ignore
