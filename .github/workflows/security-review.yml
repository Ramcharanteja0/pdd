name: Security Review
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Server dependencies
        working-directory: ./server
        run: npm ci || npm install

      - name: Run Security Report Generator
        continue-on-error: true
        working-directory: ./server
        run: npm run generate-security-report || node scripts/generate-security-report.js

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-security-reports-excel
          path: server/Vulnerability Test Results/
          if-no-files-found: ignore
