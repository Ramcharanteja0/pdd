name: Security Review Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies for Scanners
        run: |
          cd e2e-web && npm install
          cd ../server && npm install

      - name: Run Web Security Scanner
        working-directory: ./e2e-web
        run: |
          node scripts/generateWebSecuritySuite.js
          
          # Append to Step Summary
          if [ -f Test_Results/Security/web-executive-summary.md ]; then
            cat Test_Results/Security/web-executive-summary.md >> $GITHUB_STEP_SUMMARY
          fi
          
          # Enforce Zero Critical Policy
          if [ -f Test_Results/Security/web-executive-summary.md ]; then
            CRITICAL_COUNT=$(grep -oP 'Critical:\s*\K\d+' Test_Results/Security/web-executive-summary.md || echo "0")
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "::error::Web Security scan failed: Found $CRITICAL_COUNT Critical findings!"
              exit 1
            fi
          fi

      - name: Run Backend Security Scanner
        working-directory: ./server
        run: |
          node scripts/generateSecuritySuite.js
          
          # Append to Step Summary
          if [ -f Test_Results/Security/executive-summary.md ]; then
            echo "---" >> $GITHUB_STEP_SUMMARY
            cat Test_Results/Security/executive-summary.md >> $GITHUB_STEP_SUMMARY
          fi
          
          # Enforce Zero Critical Policy
          if [ -f Test_Results/Security/executive-summary.md ]; then
            CRITICAL_COUNT=$(grep -oP 'Critical:\s*\K\d+' Test_Results/Security/executive-summary.md || echo "0")
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "::error::Backend Security scan failed: Found $CRITICAL_COUNT Critical findings!"
              exit 1
            fi
          fi

      - name: Upload Security Reports Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            e2e-web/Test_Results/Security/
            server/Test_Results/Security/
