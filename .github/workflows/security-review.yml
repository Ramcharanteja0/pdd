name: Security Review Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies for Scanners
        run: |
          cd e2e-web && npm install
          cd ../server && npm install

      - name: Run Web Security Scanner
        run: |
          cd e2e-web && node scripts/generateWebSecuritySuite.js
          
          # Append to Step Summary
          cat e2e-web/Test_Results/Security/web-executive-summary.md >> $GITHUB_STEP_SUMMARY
          
          # Enforce Zero Critical Policy
          CRITICAL_COUNT=$(grep -oP 'Critical:\s*\K\d+' e2e-web/Test_Results/Security/web-executive-summary.md || echo "0")
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Web Security scan failed: Found $CRITICAL_COUNT Critical findings!"
            exit 1
          fi

      - name: Run Backend Security Scanner
        run: |
          cd server && node scripts/generateSecuritySuite.js
          
          # Append to Step Summary
          echo "---" >> $GITHUB_STEP_SUMMARY
          cat server/Test_Results/Security/executive-summary.md >> $GITHUB_STEP_SUMMARY
          
          # Enforce Zero Critical Policy
          CRITICAL_COUNT=$(grep -oP 'Critical:\s*\K\d+' server/Test_Results/Security/executive-summary.md || echo "0")
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Backend Security scan failed: Found $CRITICAL_COUNT Critical findings!"
            exit 1
          fi

      - name: Upload Security Reports Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            e2e-web/Test_Results/Security/
            server/Test_Results/Security/
