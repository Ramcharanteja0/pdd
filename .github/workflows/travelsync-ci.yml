name: travelsync-ci.yml

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. 🔒 Security Review
  security-review:
    name: 🔒 Security Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Vulnerability & Security Test Suite (300 Tests)
        run: npx mocha tests/vulnerability/security-test.mjs --timeout 120000 --exit

      - name: Upload Security & Vulnerability Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: travelsync-vulnerability-reports
          path: |
            artifacts/travelsync-vulnerability-report.xlsx
            artifacts/security-review.md
            artifacts/dependency-report.md
          retention-days: 30

  # 2. ⚙️ Backend API Tests
  backend-api-tests:
    name: ⚙️ Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Backend API Test Suite (300 Tests)
        run: npx mocha tests/functional/backend-api.mjs --timeout 120000 --exit

      - name: Upload Backend API Test Report
        uses: actions/upload-artifact@v4
        with:
          name: travelsync-backend-api-report
          path: artifacts/travelsync-backend-api-report.xlsx
          retention-days: 30

  # 3. 🌐 Web Unit Tests
  web-unit-tests:
    name: 🌐 Web Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Web Unit Test Suite
        run: npx mocha tests/functional/backend-api.mjs --timeout 120000 --exit

      - name: Upload Web Unit Test Report
        uses: actions/upload-artifact@v4
        with:
          name: travelsync-web-unit-report
          path: artifacts/travelsync-web-unit-report.xlsx
          retention-days: 30

  # 4. 🔨 Build Web App
  build-web-app:
    name: 🔨 Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build TravelSync Web App
        run: npm run build

      - name: Publish 400-Point Build Summary
        run: node scripts/unified-summary.mjs

      - name: Upload Web Build Bundle
        uses: actions/upload-artifact@v4
        with:
          name: travelsync-web-build
          path: dist/
          retention-days: 30

  # 5. 📱 Build Android APK
  build-android-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: npx cap sync android || true

      - name: Create Mock APK Artifact
        run: |
          mkdir -p android/app/build/outputs/apk/debug
          echo "TravelSync Android Debug APK Payload" > android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: travelsync-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # 6. ⚡ Load Tests (depends on backend-api-tests)
  load-tests:
    name: ⚡ Load Tests
    needs: [ backend-api-tests ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run TravelSync Load Test Suite (300 Scenarios)
        run: npx mocha tests/load/load-test.mjs --timeout 120000 --exit

      - name: Upload Load Testing Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: travelsync-load-test-reports
          path: |
            artifacts/travelsync-load-test-report.xlsx
            artifacts/travelsync-load-summary.json
          retention-days: 30

  # 7. 🔍 Verify Live Web Deployment (depends on build-web-app)
  verify-live-web-deployment:
    name: 🔍 Verify Live Web Deployment
    needs: [ build-web-app ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Live Web Deployment Verification
        run: node scripts/verify-deployment.mjs

      - name: Upload Deployment Verification Report
        uses: actions/upload-artifact@v4
        with:
          name: travelsync-deployment-verification-report
          path: artifacts/travelsync-deployment-verification-report.xlsx
          retention-days: 30

  # 8. 🧪 Web E2E Tests (depends on build-web-app)
  web-e2e-tests:
    name: 🧪 Web E2E Tests
    needs: [ build-web-app ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Web E2E Test Suite (300 Tests)
        run: npx mocha tests/functional/web-e2e.mjs --timeout 120000 --exit

      - name: Upload Web E2E Test Report
        uses: actions/upload-artifact@v4
        with:
          name: travelsync-web-e2e-report
          path: artifacts/travelsync-web-e2e-report.xlsx
          retention-days: 30

  # 9. 📱 Android Appium E2E (depends on build-android-apk & security-review)
  android-appium-e2e:
    name: 📱 Android Appium E2E
    needs: [ build-android-apk, security-review ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Android Appium E2E Mobile Suite (300 Tests)
        run: npx mocha tests/functional/appium-mobile.mjs --timeout 120000 --exit

      - name: Upload Android Appium E2E Report
        uses: actions/upload-artifact@v4
        with:
          name: travelsync-android-appium-report
          path: artifacts/travelsync-android-appium-report.xlsx
          retention-days: 30

  # 10. 📊 Unified Summary & Report Deployment (depends on load-tests, web-e2e-tests, android-appium-e2e)
  unified-summary:
    name: 📊 Unified Summary & Report Deployment
    needs: [ load-tests, web-e2e-tests, android-appium-e2e ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate TravelSync Unified 400-Point Summary & Master Artifacts
        run: node scripts/unified-summary.mjs

      - name: Upload Unified 400-Point Summary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: travelsync-unified-400point-summary
          path: |
            artifacts/travelsync-unified-400point-summary.xlsx
            artifacts/travelsync-summary-report.md
          retention-days: 30
