name: API Load Testing

on:
  push:
    paths:
      - 'server/**'
  pull_request:
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  k6-load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start Backend Server
        working-directory: ./server
        run: |
          npm install
          node index.js &
          sleep 5

      - name: Run k6 Baseline Load Test (100 VUs, 1 Min)
        working-directory: ./server
        run: |
          k6 run --summary-export=summary.json scripts/load-test.js || true
        env:
          BACKEND_URL: http://127.0.0.1:3000

      - name: Upload k6 Load Test Summary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-summary
          path: server/summary.json
