name: Load Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Server dependencies
        working-directory: ./server
        run: npm ci || npm install

      - name: Start Server
        working-directory: ./server
        run: npm start &
        env:
          PORT: 5000

      - name: Wait for server
        run: |
          npx wait-on http://localhost:5000/api/health -t 30000

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run k6 Load Test
        continue-on-error: true
        working-directory: ./server/scripts
        run: k6 run --out json=summary.json load-test.js

      - name: Parse k6 Summary
        working-directory: ./server/scripts
        run: node parseK6Summary.js > parsed-summary.txt

      - name: Upload k6 Summary
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-summary
          path: server/scripts/parsed-summary.txt
          if-no-files-found: ignore
